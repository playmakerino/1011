plugins { id "com.android.application" }

android {
    namespace "io.github.playmakerino.tv"
    compileSdk 34
    defaultConfig {
        applicationId "io.github.playmakerino.tv"
        minSdk 21
        targetSdk 34
        // CI passes -Pvc=<run number> so every build is a higher version than the last.
        versionCode (project.hasProperty("vc") ? project.vc.toInteger() : 1)
        versionName "1." + (project.hasProperty("vc") ? project.vc : "0")
    }
    signingConfigs {
        // Fixed key committed in android/tv.jks so updates install over the previous build.
        // (A per-run debug key made Android reject each new APK as a "conflicting package".)
        release {
            storeFile rootProject.file("tv.jks")
            storePassword "android"
            keyAlias "tv"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig rootProject.file("tv.jks").exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    lint { checkReleaseBuilds false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
