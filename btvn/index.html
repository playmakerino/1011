<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1: iPhone không tự phóng to khi chạm ô nhập 13px (vẫn chụm hai ngón để phóng to được). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bài tập về nhà</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=block" rel="stylesheet">
<!-- Một trang cho cả hai việc: mở bình thường (điện thoại của bố mẹ) là trang đăng; mở với ?tv (ô "Bài tập" trên
     launcher 1011 TV) là trang xem, không sửa được. Chỉ giữ một bài: /btvn = {text, img, at}. Ảnh mới thay ảnh cũ,
     tin nhắn sửa thẳng. Giao diện theo D:\Bamboo\claude\guide\SHOPIFY-UI-GUIDE.md (Polaris). -->
<style>
  /* ---------- Chung ---------- */
  :root{
    --text:#101010; --text2:#616161; --ph:#4a4a4a; --focus:#5083f0;
    --ring:0 2px 3px -1px rgba(0,0,0,.04),0 3px 4px -1.5px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.13);
    --ring-focus:0 2px 3px -1px rgba(0,0,0,.04),0 3px 4px -1.5px rgba(0,0,0,.04),0 0 0 1px #5083f0,0 0 0 3px rgba(53,115,246,.06),0 4px 20px 2px rgba(53,115,246,.06);
    --card:0 0 2px rgba(0,0,0,.24),0 2px 12px rgba(0,0,0,.02),0 4px 16px rgba(0,0,0,.02),0 4px 48px rgba(0,0,0,.02);
    /* Máy tính và tivi: khoảng cách tới mép trên và mép dưới màn hình. */
    --gap-y:40px;
    /* Độ rộng nội dung trang đăng. Máy tính: hai thẻ vuông vừa chiều cao màn hình (lề trên 34px + hàng tiêu đề 28px + 12px,
       lề dưới 40px; hai thẻ, khe 12px, lề hai bên 16px), tối đa 760px. */
    --mw:1000px;
  }
  @media (min-width:768px){ :root{--mw:min(760px, calc((100vh - 114px) * 2 + 44px))} }
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--text)}
  body{font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:20px;letter-spacing:-.01em}
  button{font-family:inherit;line-height:20px;letter-spacing:inherit;padding:0;border:0;cursor:pointer}
  [hidden]{display:none!important}
  /* Chống xô lệch bố cục: nội dung ẩn (vẫn giữ chỗ) tới khi có dữ liệu đầu tiên và ảnh đã giải mã; xem ready(). */
  body.loading main.edit,body.loading .bar .note,body.loading .view .stage{visibility:hidden}

  /* ---------- Trang đăng ---------- */
  /* Thanh trên: lề trái bằng lề của main.edit (rộng --mw, đặt giữa), để tiêu đề thẳng mép trái thẻ như trên tivi. */
  .bar{position:sticky;top:0;z-index:5;height:52px;display:flex;align-items:center;gap:8px;padding:0 max(16px, calc((100% - var(--mw)) / 2 + 16px))}
  body.scrolled .bar{background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.07)}
  .bar h1{margin:0;font-size:13px;line-height:28px;font-weight:500;letter-spacing:-.02em}
  .bar .note{flex:1;min-width:0;color:var(--text2);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Thanh lưu: chỉ hiện khi có thay đổi chưa lưu (contextual save bar). */
  .savebar{position:fixed;top:12px;left:50%;z-index:10;transform:translate(-50%,-8px);opacity:0;pointer-events:none;
    height:36px;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 16px;border-radius:9999px;background:#0a0a0a;color:#fff;
    font-weight:450;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .2s,transform .2s}
  .savebar.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .savebar span{margin-right:8px}
  .savebar button{height:28px;border-radius:9999px;padding:4px 12px;font-size:13px}
  .savebar .discard{background:#303030;color:#fff;font-weight:600}
  .savebar .discard:hover{background:#404040}
  .savebar .ok{background:#fff;color:#101010;font-weight:500;min-width:52px;display:grid;place-items:center}
  .savebar .ok:hover{background:#ebebeb}
  .savebar.busy .discard{background:#202020;color:rgba(255,255,255,.3);pointer-events:none}
  .savebar.busy .ok{pointer-events:none}
  .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(16,16,16,.2);border-top-color:#101010;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* Kết quả lưu: hiện đúng chỗ thanh lưu (save result toast). */
  .toast{position:fixed;left:50%;top:12px;z-index:11;transform:translate(-50%,-8px);opacity:0;pointer-events:none;min-height:36px;
    display:flex;align-items:center;gap:6px;padding:8px 16px 8px 12px;border-radius:9999px;background:#0a0a0a;color:#fff;font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:#8e0b21;border-radius:18px;padding-left:16px}
  .toast.err svg{display:none}

  /* Hai thẻ. Điện thoại: một cột, thẻ tin nhắn vuông, thẻ ảnh cao theo ảnh. Máy tính: hai cột, hai thẻ vuông.
     Ô nhập và ô ảnh lấp hết phần còn lại của thẻ. */
  main.edit{max-width:var(--mw);margin:0 auto;padding:0 16px 24px;display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
  .card{background:#fff;border-radius:20px;box-shadow:var(--card);padding:16px;display:flex;flex-direction:column;min-width:0}
  .card.text-card{aspect-ratio:1}
  .card h2{margin:0 0 12px;font-size:13px;line-height:20px;font-weight:500;letter-spacing:-.02em}
  .help{font-size:12px;line-height:18px;color:var(--ph);margin-top:4px}
  textarea{display:block;width:100%;flex:1;min-height:0;resize:none;overflow:auto;border:0;outline:0;border-radius:12px;padding:6px 12px;
    font:inherit;font-size:13px;line-height:20px;letter-spacing:inherit;color:var(--text);box-shadow:var(--ring)}
  textarea::placeholder{color:var(--ph)}
  textarea:focus{box-shadow:var(--ring-focus)}
  /* Ô ảnh: chưa có ảnh là vùng nét đứt với nút "Thêm ảnh"; có ảnh thì chỉ còn ảnh, bấm vào ảnh để thay. */
  .zone{position:relative;border:1px dashed #c0c0c0;border-radius:8px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;cursor:pointer;outline:0}
  .zone:hover .pill,.zone:focus-visible .pill{background:#e3e3e3}
  .zone:focus-visible{border-color:var(--focus)}
  .pill{height:28px;border-radius:9999px;padding:4px 12px 4px 8px;background:#ebebeb;font-weight:500;display:inline-flex;align-items:center;gap:4px}
  /* Có ảnh: mỗi ảnh một cột bằng nhau; chưa đủ 2 ảnh thì một nút "Thêm ảnh" ở hàng dưới, thẳng mép trái. */
  .zone.filled{padding:0;border:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;align-items:stretch;cursor:default}
  .zone .shot{position:relative;min-width:0;min-height:0;cursor:pointer}
  .zone .add{grid-row:2;grid-column:1/-1;justify-self:start;cursor:pointer}
  .zone .add:hover .pill{background:#e3e3e3}
  .zone img{display:block;width:100%;height:auto;border-radius:6px}
  .zone .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:#fff;display:none;place-items:center;color:#4a4a4a;
    box-shadow:0 0 0 1px rgba(0,0,0,.07),0 2px 20px rgba(0,0,0,.03)}
  .zone .x:hover{background:#f7f7f7}
  .zone .shot:hover .x,.zone .shot:focus-within .x{display:grid}
  @media (hover:none){ .zone.filled .x{display:grid} }
  @media (min-width:768px){
    /* Nét chữ tiêu đề cách mép trên --gap-y (hàng 28px có 6px trống trên chữ 13px, nên lề trên bớt 6px), rồi 12px tới
       thẻ; đáy thẻ cách mép dưới --gap-y. */
    .bar{height:calc(var(--gap-y) + 34px);padding-top:calc(var(--gap-y) - 6px);padding-bottom:12px}
    main.edit{grid-template-columns:1fr 1fr;padding-bottom:var(--gap-y)}
    .card{aspect-ratio:1}
    .zone{flex:1;min-height:0;justify-content:center}
    .zone.filled{grid-template-rows:minmax(0,1fr) auto}
    .zone .shot img{height:100%;object-fit:contain;object-position:top}
  }

  /* ---------- Trang xem (tivi, ?tv) ---------- */
  body.tv{height:100vh;overflow:hidden}
  /* Hai bên: lề an toàn của Android TV, 5% (tivi cắt bớt mép). Trên và dưới: --gap-y cộng hàng tiêu đề 40px, bằng nhau
     để khung nằm đúng giữa màn hình theo cả hai chiều. */
  .view{height:100vh;padding:calc(var(--gap-y) + 40px) 5vw;display:flex;flex-direction:column;justify-content:center}
  /* Khối chỉ chứa khung; layout() đặt độ rộng. Tiêu đề đặt ngay trên khung, thẳng mép trái, không làm lệch khung. */
  /* Có ảnh (tối đa 2) thì mỗi ảnh một box riêng bên phải tin nhắn, cùng hàng, cách nhau 12px, cao hết phần giữa hai lề. */
  .view .stage{position:relative;max-height:100%;min-height:0;margin:0 auto;display:flex;align-items:flex-start;gap:12px}
  /* Dòng tiêu đề như thanh trên của Shopify (Analytics · Last refreshed): tên đậm vừa, ghi chú xám cùng cỡ. */
  .view .top{position:absolute;left:0;bottom:100%;height:40px;padding-bottom:12px;display:flex;align-items:center;gap:6px;font-size:13px;line-height:28px;letter-spacing:-.02em;color:var(--text2);white-space:nowrap}
  .view .top b{color:var(--text);font-weight:500;margin-right:.2em}
  /* Box tin nhắn cao theo nội dung; cao quá màn hình thì dừng ở đó và cuộn.
     Chữ 16px như _TitleText_ ở Shopify Analytics, cao dòng 24px cho đoạn nhiều dòng. */
  .view .msg,.view .pic{flex:none;max-height:100%;background:#fff;border-radius:20px;box-shadow:var(--card)}
  .view .msg{padding:16px;overflow:auto;scrollbar-width:none}
  .view .msg::-webkit-scrollbar{display:none}
  .view .txt{white-space:pre-wrap;word-wrap:break-word;font-size:16px;line-height:24px;letter-spacing:-.13px}
  /* Box ảnh không có lề trắng: ảnh lấp kín box, box có đúng tỉ lệ ảnh. */
  /* Như ô ảnh trong phần Media của trang sản phẩm Shopify admin: không bóng, bo 12px, nền #f7f7f7,
     khung 1px rgba(0,0,0,.08) vẽ đè lên mép ảnh bằng ::after. */
  .view .pic{position:relative;overflow:hidden;border-radius:12px;background:#f7f7f7;box-shadow:none}
  .view .pic img{display:block;width:100%;height:100%;object-fit:cover}
  .view .pic::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);pointer-events:none}
  .view .empty{color:var(--text2)}
</style>
</head>
<body class="loading">

<div id="edit" hidden>
  <header class="bar">
    <h1>Bài tập về nhà</h1>
    <span class="note" id="meta"></span>
  </header>
  <div class="savebar" id="savebar">
    <span>Chưa lưu thay đổi</span>
    <button class="discard" id="discard" type="button">Huỷ</button>
    <button class="ok" id="save" type="button">Lưu</button>
  </div>
  <main class="edit">
    <section class="card text-card">
      <h2>Tin nhắn của cô</h2>
      <textarea id="text" aria-label="Tin nhắn của cô" placeholder="Dán tin nhắn của cô vào đây"></textarea>
      <div class="help">Sửa thẳng tin nhắn cũ, lưu xong tivi đổi theo.</div>
    </section>
    <section class="card">
      <h2>Ảnh bài mẫu</h2>
      <div class="zone" id="zone" tabindex="0" role="button" aria-label="Chọn ảnh bài mẫu"></div>
      <div class="help">Tối đa 2 ảnh.</div>
      <input type="file" id="file" accept="image/*" hidden>
    </section>
  </main>
  <div class="toast" id="toast"></div>
</div>

<div class="view" id="view" hidden>
  <div class="stage" id="stage">
    <div class="top" id="top"></div>
    <div class="msg" id="msg" tabindex="0">
      <div class="txt" id="txt"></div>
    </div>
    <div class="pic" hidden><img alt=""></div>
    <div class="pic" hidden><img alt=""></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>
<script>
(function(){
  const TV = new URLSearchParams(location.search).has('tv');
  const $ = id => document.getElementById(id);
  const DAYS = ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  const pad = n => String(n).padStart(2,'0');
  // Hiện nội dung một lần, sau khi ảnh (nếu có) đã giải mã; quá 4 giây thì hiện luôn.
  const ready = el => (el && el.getAttribute('src') ? el.decode().catch(() => {}) : Promise.resolve())
    .then(() => document.body.classList.remove('loading'));
  setTimeout(() => document.body.classList.remove('loading'), 4000);
  const when = t => { const d=new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes())+' '+DAYS[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1); };

  let ref = null;
  if (typeof firebase !== 'undefined') {
    firebase.initializeApp({
      apiKey: "AIzaSyCQnlQxrXyceuYHCNnyGIEAyU_KyBQUAXs",
      authDomain: "a2-1011-thoi-gian.firebaseapp.com",
      databaseURL: "https://a2-1011-thoi-gian-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "a2-1011-thoi-gian",
      storageBucket: "a2-1011-thoi-gian.firebasestorage.app"
    });
    ref = firebase.database().ref('btvn');
  }

  if (TV) { document.body.classList.add('tv'); $('view').hidden = false; }
  else { $('edit').hidden = false; }

  /* ---------- Trang xem ---------- */
  const pics = [...document.querySelectorAll('.view .pic')];
  const imgsOf = d => d ? [d.img, d.img2].filter(Boolean) : [];
  function renderView(d){
    const top = $('top'), txt = $('txt'), list = imgsOf(d);
    const empty = !d || (!d.text && !list.length);
    top.innerHTML = empty ? '' : '<b>Bài tập về nhà</b><span>Gửi vào ' + when(d.at) + '</span>';
    if (empty) txt.innerHTML = '<span class="empty">Chưa có bài tập</span>';
    else txt.textContent = d.text || '';
    $('msg').hidden = !empty && !d.text;
    pics.forEach((p, i) => {
      const im = p.firstElementChild;
      p.hidden = !list[i];
      if (list[i]) { if (im.getAttribute('src') !== list[i]) im.src = list[i]; }
      else im.removeAttribute('src');
    });
    $('msg').scrollTop = 0;
    layout();
  }
  // Box tin nhắn rộng bằng khổ A4 dọc (210 × 297) của chiều cao tối đa; chiều cao thì theo nội dung.
  // Box ảnh cao hết chiều cao tối đa, rộng theo tỉ lệ ảnh. Thiếu chỗ thì box tin nhắn hẹp lại, tới 280px;
  // vẫn thiếu thì các box ảnh cùng thấp xuống.
  function layout(){
    const v = $('view'), cs = getComputedStyle(v), m = $('msg');
    const W = v.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = v.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const shown = pics.filter(p => !p.hidden && p.firstElementChild.naturalWidth);
    const ratios = shown.map(p => p.firstElementChild.naturalWidth / p.firstElementChild.naturalHeight);
    const boxes = shown.length + (m.hidden ? 0 : 1), gaps = Math.max(0, boxes - 1) * 12;
    let mw = m.hidden ? 0 : Math.min(W, Math.round(H * 210 / 297));
    const sum = ratios.reduce((a, r) => a + r, 0);
    let h = H;
    if (sum) {
      const minMw = m.hidden ? 0 : Math.min(mw, 280);
      h = Math.min(H, (W - gaps - minMw) / sum);
      mw = m.hidden ? 0 : Math.min(mw, W - gaps - Math.round(h * sum));
    }
    shown.forEach((p, i) => { p.style.height = Math.round(h) + 'px'; p.style.width = Math.round(h * ratios[i]) + 'px'; });
    m.style.width = mw + 'px'; m.style.maxHeight = H + 'px';
    $('stage').style.width = mw + gaps + shown.reduce((a, p) => a + parseFloat(p.style.width), 0) + 'px';
  }
  if (TV) {
    addEventListener('resize', layout);
    pics.forEach(p => p.firstElementChild.addEventListener('load', layout));
    // Lên/xuống trên remote cuộn tin nhắn dài.
    addEventListener('keydown', e => {
      const m = $('msg'), step = m.clientHeight * .6;
      if (e.key === 'ArrowDown') { m.scrollBy({top: step, behavior:'smooth'}); e.preventDefault(); }
      if (e.key === 'ArrowUp') { m.scrollBy({top: -step, behavior:'smooth'}); e.preventDefault(); }
    });
    if (ref) ref.on('value', s => { renderView(s.val()); ready(pics[0].hidden ? null : pics[0].firstElementChild); },
      () => { renderView(null); ready(); });
    else { renderView(null); ready(); }
    return;
  }

  /* ---------- Trang đăng ---------- */
  const text = $('text'), zone = $('zone'), file = $('file'), save = $('save');
  let saved = {text:'', imgs:[], at:0};  // bản đang có trên Firebase (ảnh ở img và img2)
  let imgs = [];                         // ảnh đang hiển thị trong ô (data URL), tối đa 2
  let slot = 0;                          // ảnh vừa chọn từ máy sẽ vào vị trí này
  const same = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

  addEventListener('scroll', () => document.body.classList.toggle('scrolled', scrollY > 0), {passive:true});

  let toastTimer;
  function toast(msg, err){
    const t = $('toast');
    t.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="#36b37e"/><path d="M5.5 9.2l2.3 2.3 4.7-4.8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    t.append(msg); t.classList.toggle('err', !!err); t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), err ? 6000 : 4000);
  }
  function dirty(){ return text.value !== saved.text || !same(imgs, saved.imgs); }
  function refresh(){ $('savebar').classList.toggle('on', dirty()); }
  $('discard').addEventListener('click', () => { text.value = saved.text; imgs = saved.imgs.slice(); drawZone(); refresh(); });
  function meta(){
    $('meta').textContent = saved.at ? 'Gửi vào ' + when(saved.at) : 'Chưa có bài';
  }

  // Chưa có ảnh: vùng nét đứt "Thêm ảnh". Có ảnh: các ảnh cạnh nhau, mỗi ảnh có nút bỏ; còn chỗ thì một nút "Thêm ảnh" bên dưới.
  const PILL = '<span class="pill"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="#101010" stroke-width="1.6" stroke-linecap="round"/></svg>Thêm ảnh</span>';
  function drawZone(){
    zone.classList.toggle('filled', imgs.length > 0);
    if (!imgs.length) { zone.innerHTML = PILL; zone.dataset.slot = 0; return; }
    zone.innerHTML = '';
    imgs.forEach((src, i) => {
      const s = document.createElement('div');
      s.className = 'shot'; s.dataset.slot = i;
      s.innerHTML = '<img alt="Ảnh bài mẫu ' + (i + 1) + '"><button class="x" type="button" aria-label="Bỏ ảnh">'
        + '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>';
      s.querySelector('img').src = src;
      const x = s.querySelector('.x');
      x.addEventListener('click', e => { e.stopPropagation(); imgs.splice(i, 1); drawZone(); refresh(); });
      x.addEventListener('keydown', e => e.stopPropagation());
      zone.append(s);
    });
    if (imgs.length < 2) {
      const a = document.createElement('div');
      a.className = 'add'; a.dataset.slot = imgs.length; a.innerHTML = PILL;
      zone.append(a);
    }
  }

  // Thu nhỏ ảnh: cạnh dài 1600, JPEG 0.82 (khoảng 200 đến 400 kB), đủ nét trên tivi 1080p.
  function shrink(f){
    return new Promise((ok, bad) => {
      const u = URL.createObjectURL(f), im = new Image();
      im.onload = () => {
        const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', .82));
      };
      im.onerror = () => { URL.revokeObjectURL(u); bad(); };
      im.src = u;
    });
  }
  // Đưa ảnh vào vị trí i (0 hoặc 1); không chỉ rõ thì vào chỗ trống kế tiếp, đủ 2 ảnh rồi thì thay ảnh thứ hai.
  async function take(files, i){
    files = [...files].filter(f => f && /^image\//.test(f.type));
    for (const f of files) {
      const at = i != null ? i : Math.min(imgs.length, 1);
      i = null;
      try { imgs[at] = await shrink(f); }
      catch(e){ toast('Không đọc được ảnh này', true); }
    }
    imgs = imgs.filter(Boolean).slice(0, 2); drawZone(); refresh();
  }

  // Bấm vào ảnh nào thì thay ảnh đó; bấm "Thêm ảnh" thì thêm vào chỗ trống.
  const pick = e => { const t = e.target.closest('[data-slot]'); slot = t ? +t.dataset.slot : Math.min(imgs.length, 1); file.multiple = slot === imgs.length; file.click(); };
  zone.addEventListener('click', pick);
  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e); } });
  file.addEventListener('change', () => { take(file.files, slot); file.value = ''; });
  zone.addEventListener('dragover', e => e.preventDefault());
  zone.addEventListener('drop', e => { e.preventDefault(); const t = e.target.closest('.shot'); take(e.dataTransfer.files, t ? +t.dataset.slot : null); });
  addEventListener('paste', e => {
    const its = [...(e.clipboardData ? e.clipboardData.items : [])].filter(i => i.type.startsWith('image/'));
    if (!its.length) return;
    take(its.map(i => i.getAsFile()));
    // Copy từ Zalo có cả chữ lẫn ảnh: chữ vẫn dán vào ô tin nhắn như bình thường, chỉ chặn khi không có chữ.
    const hasText = e.clipboardData.types.includes('text/plain') && e.clipboardData.getData('text/plain').trim();
    if (!(hasText && e.target === text)) e.preventDefault();
  });
  text.addEventListener('input', refresh);
  addEventListener('beforeunload', e => { if (dirty()) e.preventDefault(); });

  save.addEventListener('click', () => {
    if (!ref) { toast('Không kết nối được Firebase', true); return; }
    const next = {text: text.value, imgs: imgs.slice(), at: Date.now()};
    $('savebar').classList.add('busy'); save.innerHTML = '<span class="spin"></span>';
    // Ảnh không đổi thì không gửi lại.
    const p = same(imgs, saved.imgs) ? ref.update({text: next.text, at: next.at})
      : ref.set({text: next.text, img: imgs[0] || '', img2: imgs[1] || '', at: next.at});
    // Lỗi của trang sau khi đã ghi xong không được báo thành "Lưu không được".
    p.then(() => { saved = next; toast('Đã lưu'); try { meta(); } catch (e) { console.error(e); } },
           e => toast(/permission/i.test(e && e.message) ? 'Firebase chưa cho ghi nhánh /btvn' : 'Lưu không được, thử lại', true))
     .finally(() => { $('savebar').classList.remove('busy'); save.textContent = 'Lưu'; refresh(); });
  });

  drawZone(); meta();
  if (ref) ref.on('value', s => {
    const d = s.val() || {};
    const wasDirty = dirty();
    saved = {text: d.text || '', imgs: imgsOf(d), at: d.at || 0};
    // Đang sửa dở thì không ghi đè ô nhập.
    if (!wasDirty) { text.value = saved.text; imgs = saved.imgs.slice(); drawZone(); }
    meta(); refresh();
    ready(zone.querySelector('img'));
  }, () => { toast('Firebase chưa cho đọc nhánh /btvn', true); ready(); });
  if (!ref) ready();
})();
</script>
</body>
</html>
