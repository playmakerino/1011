<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đồng Hồ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fdf6f0; --ink:#2b2b33; --card:#fff; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--ink); font-family:'Space Grotesk',system-ui,sans-serif;
        display:flex; align-items:center; justify-content:center; padding:4vmin; }
  .pick{ display:flex; gap:5vmin; width:100%; max-width:1400px; justify-content:center; flex-wrap:wrap; }
  .card{ flex:1 1 320px; max-width:600px; border:0; padding:0; border-radius:28px; overflow:hidden; cursor:pointer;
         background:var(--card); color:inherit; font:inherit; text-decoration:none; text-align:center;
         box-shadow:0 8px 30px rgba(60,40,20,.12); transition:transform .15s; }
  .card:hover,.card:focus{ transform:translateY(-4px); outline:none; }
  .card img{ display:block; width:100%; aspect-ratio:4/3; object-fit:contain; background:var(--bg); }
  .card span{ display:block; padding:2.4vmin 0 2.8vmin; font-size:clamp(24px,4.5vmin,48px); font-weight:700; }
</style>
</head>
<body>
  <!-- The "Đồng Hồ" TV app opens here and lets the child pick one of the two clocks. -->
  <nav class="pick">
    <a class="card" id="dongHo" href="dong-ho.html"><img src="img/dong-ho.png" alt=""><span>Đồng Hồ</span></a>
    <a class="card" href="hoc-dong-ho.html"><img src="img/hoc-dong-ho.png" alt=""><span>Học Đồng Hồ</span></a>
  </nav>
<script>
  // Điều khiển bằng remote trong app TV (tv-nav.js không làm gì trên trình duyệt).
  window.TVNav = { first: '#dongHo' };
</script>
<script src="tv-nav.js"></script>
</body>
</html>
