<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f0f0f">
<title>TV</title>
<link rel="preconnect" href="https://www.googleapis.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://www.youtube-nocookie.com">
<!-- Roboto is fetched without blocking first paint (Android already has Roboto as its system font) -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{ --bg:#0f0f0f; --ink:#f1f1f1; --muted:#aaa; --line:rgba(255,255,255,.3); --chip:#272727; --chip-hover:#3f3f3f; --ph:#272727; --focus:#fff; color-scheme:dark }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0; background:var(--bg)}
  body{ font:14px/1.4 Roboto,system-ui,Arial,sans-serif; color:var(--ink); -webkit-tap-highlight-color:transparent; }
  button{font-family:inherit}
  img{display:block}

  main{max-width:1280px; margin:0 auto; padding:20px 24px 80px}

  .nav{display:flex; align-items:center; gap:14px; margin:0 0 20px}
  .navtitle{font-size:20px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  .home,.grid{grid-template-columns:1fr} /* mobile: 1 col */
  @media(min-width:600px){ .home,.grid{grid-template-columns:repeat(3,minmax(0,1fr))} } /* tablet / TV / desktop: 3 cols */
  .home{display:grid; gap:16px}
  .src{ background:none; border:none; text-align:left; cursor:pointer; padding:0; display:flex; flex-direction:column; gap:10px; color:inherit }
  .src .banner{position:relative; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:var(--ph)}
  .src .banner img{width:100%; height:100%; object-fit:cover}
  .src:hover .banner{filter:brightness(1.1)}
  .src .badge{ position:absolute; top:8px; left:8px; background:rgba(0,0,0,.75); color:#fff; font-weight:500; font-size:12px; padding:3px 8px; border-radius:6px; }
  .src .nm{font-size:16px; font-weight:700; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .src .sub{color:var(--muted); font-size:13px; margin-top:2px}

  .grid{display:grid; gap:36px 16px}
  .card{cursor:pointer; display:flex; flex-direction:column}
  .thumb{position:relative; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:var(--ph)}
  .thumb img{width:100%; height:100%; object-fit:cover}
  .dur{ position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.8); color:#fff; font-size:12px; font-weight:500; padding:2px 5px; border-radius:5px; line-height:1.2; }
  .row{display:flex; gap:12px; margin-top:12px}
  .av{width:36px; height:36px; border-radius:50%; flex:0 0 36px; object-fit:cover; background:var(--chip)}
  .txt{min-width:0}
  .title{font-size:15px; font-weight:500; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .byline{color:var(--muted); font-size:13px; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .byline .ch{display:block}

  .btn{ cursor:pointer; font-size:14px; font-weight:500; border:1px solid var(--line); padding:9px 16px; border-radius:999px; background:var(--chip); color:var(--ink); }
  .btn:hover{background:var(--chip-hover)}
  .btn:disabled{opacity:.5; cursor:default}
  .more{display:flex; justify-content:center; margin:40px 0 0}

  .state{text-align:center; color:var(--muted); padding:70px 20px; font-size:15px}
  .state .btn{margin-top:18px}

  .sk .l{height:14px; border-radius:6px; background:var(--ph); margin-top:10px}
  .sk .l.s{width:55%}

  /* Player: hidden with visibility (not display:none) so the iframe keeps its real size while closed —
     it initialises at the right resolution and can pre-buffer in the background. Edge-to-edge so the
     WebView fullscreen transition (up to a second on TV boxes) shows no jump from a smaller box. */
  .modal{position:fixed; inset:0; z-index:50; background:#000; visibility:hidden}
  .modal.open{visibility:visible}
  .player{position:relative; width:100%; height:100%; overflow:hidden; outline:none}
  .player iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
  .toast{position:absolute; left:50%; bottom:14%; transform:translateX(-50%); z-index:2; background:rgba(0,0,0,.8); color:#fff; font-size:22px; font-weight:500; padding:10px 18px; border-radius:10px; pointer-events:none; white-space:nowrap}
  @media (max-width:520px){ main{padding:16px 14px 60px} }

  /* TikTok profile: portrait 9:16 thumbnails, like the app's grid */
  .ttgrid{display:grid; gap:8px; grid-template-columns:repeat(3,1fr)}
  @media(min-width:600px){ .ttgrid{grid-template-columns:repeat(6,1fr); gap:10px} }
  .ttitem{position:relative; aspect-ratio:9/16; border-radius:8px; overflow:hidden; background:var(--ph); border:none; padding:0; cursor:pointer; color:inherit}
  .ttitem img{width:100%; height:100%; object-fit:cover}
  .ttitem .v{position:absolute; left:8px; bottom:7px; display:flex; align-items:center; gap:4px; color:#fff; font-size:13px; font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .ttitem .v svg{width:15px; height:15px; fill:#fff; filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
  .ttitem:hover img{filter:brightness(1.08)}

  /* TikTok player: full-screen vertical feed; caption/date live in a side panel, not over the video */
  .ttfeed{position:fixed; inset:0; z-index:60; background:#000; display:flex; align-items:center; justify-content:center; outline:none}
  .ttstage{position:relative; height:100%; aspect-ratio:9/16; max-width:100%; background:#000 center/cover no-repeat; flex:0 0 auto}
  .ttstage iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
  /* absolute in the left black bar, hugging the video's left edge and aligned to its bottom
     (video width = 100vh*9/16, so its left edge is at 50vw - 28.125vh) */
  .ttinfo{position:absolute; left:28px; right:calc(50vw + 28.125vh + 16px); bottom:28px; max-height:calc(100vh - 56px); overflow:auto; color:#fff}
  .ttinfo .tttitle{font-size:16px; font-weight:400; color:#fff; line-height:1.4} /* channel name · date */
  .ttinfo .tttitle b{font-weight:700}
  .ttinfo .ttdate{color:#bbb}
  .ttinfo .ttsub{color:#f1f1f1; font-size:15px; margin-top:12px; line-height:1.5; white-space:pre-wrap; word-break:break-word} /* full caption, no clamp */
  .ttinfo .tttoast{display:inline-block; margin-top:16px; background:rgba(255,255,255,.14); color:#fff; font-size:20px; font-weight:600; padding:8px 16px; border-radius:10px}
  @media (max-width:820px){ /* portrait phone: video on top, caption below */
    .ttfeed{flex-direction:column; gap:12px}
    .ttstage{height:68vh}
    .ttinfo{position:static; transform:none; width:100%; max-width:none; padding:0 16px; text-align:center} /* below the video on phones */
    .ttinfo .tttitle{font-size:15px} .ttinfo .ttsub{font-size:13px}
  }

  /* D-pad / keyboard focus (Android TV WebView has no mouse cursor): white ring like the YouTube TV app */
  .src:focus,.card:focus,.ttitem:focus{outline:none}
  .src:focus-visible .banner,.card:focus-visible .thumb{outline:4px solid var(--focus); outline-offset:2px}
  .ttitem:focus-visible{outline:4px solid var(--focus); outline-offset:-2px}
  .btn:focus-visible{outline:4px solid var(--focus); outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="nav" id="nav" hidden>
    <div class="navtitle" id="navtitle"></div>
  </div>
  <div class="home" id="home" hidden></div>
  <div class="grid" id="grid" hidden></div>
  <div class="ttgrid" id="ttgrid" hidden></div>
  <div class="state" id="state" hidden></div>
  <div class="more" id="moreWrap" hidden><button class="btn" id="moreBtn" type="button">Load more</button></div>
</main>

<div class="modal" id="modal" aria-hidden="true">
  <div class="player" id="player" tabindex="-1">
    <div class="toast" id="toast" hidden></div>
  </div>
</div>

<!-- TikTok: full-screen vertical feed. Up/Down (or swipe) change video; we swap the iframe ourselves, so
     paging always works even though the embed player exposes almost no control API. -->
<div class="ttfeed" id="ttfeed" tabindex="-1" hidden>
  <div class="ttstage" id="ttstage"></div>
  <div class="ttinfo">
    <div class="tttitle" id="tttitle"></div>
    <div class="ttsub" id="ttsub"></div>
    <div class="tttoast" id="tttoast" hidden></div>
  </div>
</div>

<script>
// ====== CONFIG — only the sources listed here can be watched ======
const API_KEY = "AIzaSyDGWoJDMbutkYWJZZzullATm1cnttCAQUE"; // restricted: github.io referrer + YouTube Data API only
// type: "playlist" (its videos) | "channel" (its uploads as videos) | "channelPlaylists" (click -> its playlists, sorted by count)
//     | "tiktok" (opens a full-screen vertical TikTok feed; videos come from a JSON file a daily GitHub Action refreshes)
// subs:false  -> don't force English subtitles on for this source (default: forced on)
// autonext    -> play as a playlist so the next video starts by itself
const SOURCES = [
  { id:"paw",     type:"channelPlaylists", handle:"@PAWPatrolOfficial" },
  { id:"kdh",     type:"playlist",        playlistId:"PLDwbngJoT5crMIEVzjs4ltzjG2WiBX1Sm", autonext:true }, // Kpop Demon Hunters
  { id:"maruko",  type:"playlist",        playlistId:"PLQGFvBFre_B3zygU6fi8irYZAZw6Pz7TP" }, // Chibi Maruko Chan English
  { id:"cloud",   type:"playlist",        playlistId:"PLfYEB5yLOF-CA0qZ4j3N19waHIDQFalqE" },
  { id:"pokemon", type:"channelPlaylists", handle:"@PokémonAsiaENG" },
  { id:"pnf",     type:"playlist",        playlistId:"PLiv1IUQDVSNKB3oq2gblc2dYkjhn_iIFi" }, // Phineas and Ferb S1
  { id:"bears",   type:"channelPlaylists", handle:"@WeBareBearsOfficial" },
  { id:"anhthu",  type:"channel",         handle:"@AnhThufamily", subs:false },
  { id:"teubongday", type:"tiktok",       handle:"@teubongday", file:"tiktok/teubongday.json" },
];
const PAGE_SIZE = 24;
const REGION = "VN"; // hide videos that can't play in this region (region-blocked / not embeddable)
const PREBUFFER_MS = 400; // a card focused this long starts loading its video muted in the hidden player
// ==================================================================

const API = "https://www.googleapis.com/youtube/v3/";
const IN_APP = /\bTVApp\//.test(navigator.userAgent); // the Android wrapper tags its user agent
const $ = s => document.querySelector(s);
const homeEl=$("#home"), gridEl=$("#grid"), ttgridEl=$("#ttgrid"), stateEl=$("#state"), moreWrap=$("#moreWrap"), moreBtn=$("#moreBtn");
const navEl=$("#nav"), navTitle=$("#navtitle");
const ttfeedEl=$("#ttfeed"), ttStage=$("#ttstage");

const meta={};          // source id -> resolved meta (filled from the home list)
const headers={};       // playlistId -> {title, avatar} learned while listing; saves a request when opening it
let navSeq=0;           // bumps on every route change; async guards compare against it
let cur={kind:null,key:null,token:"",done:false,pages:0}; // current list view paging state
let currentAvatar="";
let currentAutoNextList=""; // when set, player embeds the playlist so it auto-advances
let currentSubs=true;       // force English subtitles for the list being watched
const positions={};         // videoId -> index in the current playlist (to start a playlist at that video)

// <img sizes>: 1 column under 600px, else 3 columns inside a 1280px main — lets the browser pick a
// thumbnail that fits the slot instead of always downloading the 1280px one
const SIZES="(max-width:599px) calc(100vw - 28px), (max-width:1280px) calc((100vw - 80px)/3), 400px";

const decoder=document.createElement("textarea");
const decode=t=>{ decoder.innerHTML=t||""; return decoder.value; };
const esc=t=>(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const thumbs=th=>{ // {s: fallback src, ss: srcset from every size YouTube offers}
  th=th||{}; const big=th.maxres||th.standard||th.high||th.medium||th.default;
  return { s:big?big.url:"", ss:Object.values(th).filter(t=>t&&t.url&&t.width).map(t=>t.url+" "+t.width+"w").join(",") };
};
const imgTag=t=>'<img loading="lazy" decoding="async" src="'+esc(t.s)+'"'+(t.ss?' srcset="'+esc(t.ss)+'" sizes="'+SIZES+'"':'')+' alt="">';
const avpick=th=>(th&&(th.default||th.medium||th.high||{}).url)||"";

function fmtDur(iso){ const m=(iso||"").match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); if(!m) return ""; const h=+m[1]||0,mi=+m[2]||0,s=+m[3]||0,p=n=>String(n).padStart(2,"0"); return h? h+":"+p(mi)+":"+p(s):mi+":"+p(s); }
function fmtViews(n){ n=+n; if(!isFinite(n)||n<=0) return ""; if(n>=1e6) return +(n/1e6).toFixed(n>=1e7?0:1)+"M views"; if(n>=1e3) return +(n/1e3).toFixed(n>=1e4?0:1)+"K views"; return n+" views"; }
function ago(iso){ const d=(Date.now()-new Date(iso))/1000; for(const [nm,sec] of [["year",31536000],["month",2592000],["week",604800],["day",86400],["hour",3600],["minute",60]]){ const v=Math.floor(d/sec); if(v>=1) return v+" "+nm+(v>1?"s":"")+" ago"; } return "just now"; }
function watchable(v){
  if(v.status && v.status.embeddable===false) return false;
  const rr=v.contentDetails&&v.contentDetails.regionRestriction;
  if(rr){ if(rr.blocked&&rr.blocked.includes(REGION)) return false; if(rr.allowed&&!rr.allowed.includes(REGION)) return false; }
  return true;
}

async function api(path,params){
  const u=new URL(API+path);
  Object.entries(params).forEach(([k,v])=>v!=null&&u.searchParams.set(k,v));
  u.searchParams.set("key",API_KEY);
  const ac=new AbortController(), tm=setTimeout(()=>ac.abort(),15000); // a hung request must not freeze the screen
  let r,j;
  try{ r=await fetch(u,{signal:ac.signal}); j=await r.json(); }
  catch(e){ throw new Error(ac.signal.aborted?"Request timed out":"Network error"); }
  finally{ clearTimeout(tm); }
  if(!r.ok) throw new Error(j.error?.message||("HTTP "+r.status));
  return j;
}

// ---------------- CACHE: localStorage, stale-while-revalidate ----------------
// Every list is drawn from its last copy at once (instant start on a TV box, works through API hiccups),
// then re-fetched; the fresh copy only touches the screen when it differs from what was drawn.
const CK="tv1:";
const HOME_KEY="home:"+SOURCES.map(s=>s.id).join(","); // changing the source list invalidates the cached home
function cacheGet(k){ try{ const s=localStorage.getItem(CK+k); return s?{s,v:JSON.parse(s)}:null; }catch(_){ return null; } }
function cacheSet(k,s){ try{ localStorage.setItem(CK+k,s); }catch(_){ try{ cacheClear(); localStorage.setItem(CK+k,s); }catch(__){} } }
function cacheClear(){ try{ Object.keys(localStorage).filter(x=>x.startsWith(CK)).forEach(x=>localStorage.removeItem(x)); }catch(_){} }
// paint(value) runs synchronously with the cached value (if any), then again with the fetched one if it differs.
// Resolves once the fetch settles; rejects only when there was nothing cached to fall back on.
async function swr(key,fetcher,paint){
  let c=cacheGet(key);
  if(c){ try{ paint(c.v); }catch(_){ c=null; try{ localStorage.removeItem(CK+key); }catch(__){} } } // a bad copy must never block the fetch
  try{
    const v=await fetcher(), s=JSON.stringify(v);
    if(!c||s!==c.s){ cacheSet(key,s); paint(v); }
  }catch(e){ if(!c) throw e; }
}

// ---------------- ROUTER (hash = page) ----------------
function route(){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  if(!h||h==="home") return {v:"home"};
  if(h.startsWith("ch/")) return {v:"channel",id:h.slice(3)};
  if(h.startsWith("tt/")) return {v:"tiktok",id:h.slice(3)};
  if(h.startsWith("pl/")) return {v:"playlist",pid:h.slice(3)};
  return {v:"home"};
}
function render(){
  const seq=++navSeq;
  closePlayer(true); ttCloseFeed(true);
  const r=route();
  if(r.v==="home") renderHome(seq);
  else if(r.v==="channel") showChannel(r.id,seq);
  else if(r.v==="tiktok") showTikTok(r.id,seq);
  else showVideos(r.pid,seq);
}
window.addEventListener("hashchange",render);

function setView(which){ // "home" source cards | "grid" YouTube video cards | "ttgrid" TikTok portrait grid
  homeEl.hidden = which!=="home";
  gridEl.hidden = which!=="grid";
  ttgridEl.hidden = which!=="ttgrid";
  stateEl.hidden=true; moreWrap.hidden=true;
  window.scrollTo(0,0);
}
function showState(msg,err,retry){
  stateEl.hidden=false;
  stateEl.innerHTML=msg+(err?'<br><small>'+esc(err.message||String(err))+'</small>':'')+(retry?'<div><button class="btn" id="retryBtn" type="button">Retry</button></div>':'');
  if(retry){ const b=$("#retryBtn"); b.onclick=render; b.focus({preventScroll:true}); }
}
function skeletonsSrc(n){ let h=""; for(let i=0;i<n;i++) h+='<div class="src sk"><div class="banner"></div><div class="l"></div><div class="l s"></div></div>'; return h; }
function skeletons(n){ let h=""; for(let i=0;i<n;i++) h+='<div class="card sk"><div class="thumb"></div><div class="row"><div class="txt" style="flex:1"><div class="l"></div><div class="l s"></div></div></div></div>'; return h; }
// D-pad: put focus on the first item of a freshly rendered list if nothing else has it
function focusFirst(container){
  const a=document.activeElement;
  if(a && a!==document.body && a.isConnected && a!==moreBtn) return;
  const el=container.querySelector(".src,.card,.ttitem"); if(el) el.focus({preventScroll:true});
}
function refocus(container,index){ // keep the D-pad position when a list is redrawn under the user
  const el=index>=0&&container.children[index];
  if(el&&el.focus) el.focus({preventScroll:true}); else focusFirst(container);
}
function srcButton(thumb,badge,title,count,onclick){
  const b=document.createElement("button"); b.className="src"; b.type="button";
  b.innerHTML='<div class="banner">'+imgTag(thumb)+'<span class="badge">'+esc(badge)+'</span></div>'+
    '<div><div class="nm">'+esc(title)+'</div>'+(count!=null?'<div class="sub">'+count+' videos</div>':'')+'</div>';
  b.onclick=onclick; return b;
}

// ---------------- HOME: list of sources ----------------
async function fetchHome(){
  // all playlist sources go in one request; channels need one request per handle; tiktok reads its JSON file
  const pls=SOURCES.filter(s=>s.type==="playlist");
  const chs=SOURCES.filter(s=>s.type==="channel"||s.type==="channelPlaylists");
  const tts=SOURCES.filter(s=>s.type==="tiktok");
  const [jp,jc,jt]=await Promise.all([
    pls.length? api("playlists",{ part:"snippet,contentDetails", id:pls.map(s=>s.playlistId).join(",") }) : {items:[]},
    Promise.all(chs.map(s=>api("channels",{ part:"snippet,contentDetails,statistics", forHandle:s.handle }))),
    // a missing/blocked TikTok file must not blank the whole home — fall back to an empty channel
    Promise.all(tts.map(s=>fetchTikTok(s.file).catch(()=>({title:s.handle.replace(/^@/,""),avatar:"",videos:[]}))))
  ]);
  const byPl={}; (jp.items||[]).forEach(it=>byPl[it.id]=it);
  return SOURCES.map(s=>{
    if(s.type==="playlist"){
      const it=byPl[s.playlistId]; if(!it) throw new Error("Playlist not found: "+s.playlistId);
      return { title:decode(it.snippet.title), thumb:thumbs(it.snippet.thumbnails), avatar:avpick(it.snippet.thumbnails),
               playlistId:s.playlistId, type:"Playlist", count:it.contentDetails?.itemCount??null };
    }
    if(s.type==="tiktok"){
      const d=jt[tts.indexOf(s)];
      // Channel avatar: TikTok's own URLs are signed and expire in days, and yt-dlp doesn't expose one,
      // so use unavatar's stable proxy keyed by handle (always the current avatar, no expiry).
      const av=s.avatar||("https://unavatar.io/tiktok/"+s.handle.replace(/^@/,""));
      return { title:d.title||s.handle.replace(/^@/,""), thumb:{s:av,ss:""}, avatar:av,
               type:"Channel", tiktok:true, count:null, videos:d.videos||[] };
    }
    const it=jc[chs.indexOf(s)].items?.[0]; if(!it) throw new Error("Channel not found: "+s.handle);
    return { title:decode(it.snippet.title), thumb:thumbs(it.snippet.thumbnails), avatar:avpick(it.snippet.thumbnails),
             channelId:it.id, playlistId:it.contentDetails.relatedPlaylists.uploads, type:"Channel",
             count:Number(it.statistics?.videoCount)||null };
  });
}
function absorbHome(metas){ metas.forEach((m,i)=>{ meta[SOURCES[i].id]=m; if(m.playlistId) headers[m.playlistId]={title:m.title,avatar:m.avatar}; }); }
async function renderHome(seq){
  navEl.hidden=true; setView("home");
  let painted=false;
  const paint=metas=>{
    if(seq!==navSeq) return;
    absorbHome(metas);
    const fi=[...homeEl.children].indexOf(document.activeElement);
    homeEl.innerHTML="";
    SOURCES.forEach((s,i)=>{
      const m=metas[i];
      homeEl.appendChild(srcButton(m.thumb,m.type,m.title,m.count,()=>{ location.hash=(s.type==="channelPlaylists")?("ch/"+s.id):(s.type==="tiktok")?("tt/"+s.id):("pl/"+m.playlistId); }));
    });
    refocus(homeEl,fi); painted=true;
  };
  if(!cacheGet(HOME_KEY)) homeEl.innerHTML=skeletonsSrc(SOURCES.length);
  try{ await swr(HOME_KEY,fetchHome,paint); }
  catch(e){ if(seq!==navSeq||painted) return; homeEl.innerHTML=""; showState("Couldn't load the list.",e,true); }
}

// ---------------- CHANNEL: its playlists ----------------
async function fetchPlaylists(cid){
  let token="", all=[];
  do{ // every page, then sorted by video count (desc)
    const j=await api("playlists",{ part:"snippet,contentDetails", channelId:cid, maxResults:50, pageToken:token||undefined });
    all=all.concat(j.items||[]); token=j.nextPageToken||"";
  }while(token);
  all.sort((a,b)=>(b.contentDetails?.itemCount||0)-(a.contentDetails?.itemCount||0));
  return all.map(pl=>({ id:pl.id, title:decode(pl.snippet.title), thumb:thumbs(pl.snippet.thumbnails), avatar:avpick(pl.snippet.thumbnails), count:pl.contentDetails?.itemCount??null }));
}
async function showChannel(id,seq){
  const src=SOURCES.find(s=>s.id===id);
  if(!src){ location.replace("#home"); return; }
  cur={kind:"channel",key:null,token:"",done:false,pages:0};
  navEl.hidden=false; navTitle.textContent="…"; setView("home");
  if(!meta[id]) homeEl.innerHTML=skeletonsSrc(6);
  try{
    if(!meta[id]){ // deep link before the home list was ever loaded
      const p=swr(HOME_KEY,fetchHome,absorbHome);
      if(!meta[id]) await p; else p.catch(()=>{});
      if(seq!==navSeq) return;
    }
    const m=meta[id]; navTitle.textContent=m.title; cur.key=m.channelId;
  }catch(e){ if(seq!==navSeq) return; homeEl.innerHTML=""; showState("Couldn't load playlists.",e,true); return; }
  const cid=cur.key; let painted=false;
  const paint=list=>{
    if(seq!==navSeq) return;
    const fi=[...homeEl.children].indexOf(document.activeElement);
    homeEl.innerHTML="";
    list.forEach(pl=>{
      headers[pl.id]={title:pl.title,avatar:pl.avatar};
      homeEl.appendChild(srcButton(pl.thumb,"Playlist",pl.title,pl.count,()=>{ location.hash="pl/"+pl.id; }));
    });
    refocus(homeEl,fi); stateEl.hidden=true;
    if(!list.length) showState("No playlists here.");
    painted=true;
  };
  if(!cacheGet("pls:"+cid)) homeEl.innerHTML=skeletonsSrc(6);
  try{ await swr("pls:"+cid,()=>fetchPlaylists(cid),paint); }
  catch(e){ if(seq!==navSeq||painted) return; homeEl.innerHTML=""; showState("Couldn't load playlists.",e,true); }
}

// ---------------- PLAYLIST: its videos ----------------
const sourceOf=pid=>SOURCES.find(s=>s.playlistId===pid||(meta[s.id]&&meta[s.id].playlistId===pid));
async function fetchHeader(pid){
  const j=await api("playlists",{ part:"snippet", id:pid }); const it=j.items?.[0];
  return it ? {title:decode(it.snippet.title), avatar:avpick(it.snippet.thumbnails)} : {title:"",avatar:""};
}
function applyHeader(h){
  navTitle.textContent=h.title; currentAvatar=h.avatar||"";
  if(currentAvatar) gridEl.querySelectorAll(".av").forEach(i=>{ i.src=currentAvatar; i.hidden=false; }); // cards drawn before the header arrived
}
async function fetchVideoPage(pid,token){
  const jp=await api("playlistItems",{ part:"snippet,contentDetails", maxResults:PAGE_SIZE, playlistId:pid, pageToken:token||undefined });
  const pos={}, ids=[];
  (jp.items||[]).forEach(it=>{ const id=it.contentDetails?.videoId; if(id){ ids.push(id); pos[id]=it.snippet?.position; } });
  let items=[];
  if(ids.length){
    const jv=await api("videos",{ part:"snippet,contentDetails,statistics,status", id:ids.join(",") });
    items=(jv.items||[]).filter(watchable).map(v=>({ // only what the card needs, so the cache stays small
      id:v.id, title:decode(v.snippet.title), ch:decode(v.snippet.channelTitle||""), th:thumbs(v.snippet.thumbnails),
      dur:fmtDur(v.contentDetails?.duration), views:+(v.statistics?.viewCount)||0, pub:v.snippet.publishedAt||"", pos:pos[v.id] }));
  }
  return { items, next:jp.nextPageToken||"" };
}
async function showVideos(pid,seq){
  cur={kind:"videos",key:pid,token:"",done:false,pages:0}; currentAvatar="";
  const src=sourceOf(pid);
  currentAutoNextList=(src&&src.autonext)?pid:"";
  currentSubs=!(src&&src.subs===false);
  navEl.hidden=false; navTitle.textContent="…"; setView("grid");
  if(headers[pid]) applyHeader(headers[pid]); // header and videos load side by side
  else swr("plh:"+pid,()=>fetchHeader(pid),h=>{ headers[pid]=h; if(seq===navSeq) applyHeader(h); }).catch(()=>{});
  await loadVideos(true,seq);
}
async function loadVideos(first,seq){
  const pid=cur.key, token=cur.token, key="vids:"+pid+":"+token;
  const stale=()=>seq!==navSeq||cur.kind!=="videos"||cur.key!==pid;
  moreBtn.disabled=true;
  if(first&&!cacheGet(key)) gridEl.innerHTML=skeletons(8);
  let painted=false;
  const paint=page=>{
    if(stale()) return;
    if(painted){ // the fresh copy differs from the cached one already on screen
      if(!first||cur.pages>1) return;      // user paged on: cache is updated for next time, screen left alone
      if(patchCards(page.items)) return;   // same videos: texts refreshed in place, nothing rebuilt
    }
    const keep=document.activeElement&&document.activeElement.dataset.vid;
    if(first){ gridEl.innerHTML=""; cur.pages=0; for(const k in positions) delete positions[k]; }
    painted=true;
    page.items.forEach(v=>{ positions[v.id]=v.pos; gridEl.appendChild(card(v)); });
    cur.token=page.next; cur.done=!page.next;
    if(page.items.length) cur.pages++;
    else if(!cur.done){ loadVideos(false,seq); return; } // whole page region-filtered: keep going so sparse playable videos still show
    if(cur.pages<=1){ const el=keep&&gridEl.querySelector('[data-vid="'+keep+'"]'); if(el) el.focus({preventScroll:true}); else focusFirst(gridEl); }
    stateEl.hidden=true; moreWrap.hidden=cur.done;
    if(!gridEl.children.length) showState("No videos here yet.");
  };
  try{ await swr(key,()=>fetchVideoPage(pid,token),paint); }
  catch(e){ if(stale()||painted) return; if(first) gridEl.innerHTML=""; showState("Couldn't load videos.",e,first); }
  finally{ if(!stale()) moreBtn.disabled=false; }
}
function cardText(v){
  const line2=[fmtViews(v.views), v.pub?ago(v.pub):""].filter(Boolean).join(" · ");
  return '<div class="title">'+esc(v.title)+'</div><div class="byline">'+(v.ch?'<span class="ch">'+esc(v.ch)+'</span>':'')+(line2?'<span>'+esc(line2)+'</span>':'')+'</div>';
}
function card(v){
  const c=document.createElement("div"); c.className="card"; c.tabIndex=0; c.setAttribute("role","button"); c.dataset.vid=v.id;
  c.innerHTML='<div class="thumb">'+imgTag(v.th)+(v.dur?'<span class="dur">'+esc(v.dur)+'</span>':'')+'</div>'+
    '<div class="row"><img class="av" loading="lazy" decoding="async" alt=""'+(currentAvatar?' src="'+esc(currentAvatar)+'"':' hidden')+'>'+
    '<div class="txt">'+cardText(v)+'</div></div>';
  const open=()=>openPlayer(v.id);
  c.onclick=open;
  c.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } };
  c.onfocus=()=>schedulePrebuffer(v.id);
  c.onblur=()=>schedulePrebuffer(null);
  return c;
}
function patchCards(items){ // true when the grid holds exactly these videos and was updated in place
  const cards=gridEl.children;
  if(cards.length!==items.length||items.some((v,i)=>cards[i].dataset.vid!==v.id)) return false;
  items.forEach((v,i)=>{ cards[i].querySelector(".txt").innerHTML=cardText(v); const d=cards[i].querySelector(".dur"); if(d) d.textContent=v.dur; });
  return true;
}

// ---------------- TIKTOK ----------------
// A daily GitHub Action (scripts/tiktok.py) writes tiktok/<handle>.json; we just read it.
function fmtDurSec(s){ s=+s; if(!isFinite(s)||s<=0) return ""; const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=Math.floor(s%60),p=n=>String(n).padStart(2,"0"); return h?h+":"+p(m)+":"+p(ss):m+":"+p(ss); }
async function fetchTikTok(file){
  const ac=new AbortController(), tm=setTimeout(()=>ac.abort(),15000);
  let r,j;
  try{ r=await fetch(file+"?t="+Date.now(),{cache:"no-store",signal:ac.signal}); j=await r.json(); }
  catch(e){ throw new Error(ac.signal.aborted?"Request timed out":"Network error"); }
  finally{ clearTimeout(tm); }
  if(!r.ok) throw new Error("HTTP "+r.status);
  return { title:decode(j.title||""), avatar:j.avatar||"", videos:(j.videos||[]).map(v=>({
    id:String(v.id), title:decode(v.title||""), thumb:v.thumb||"", dur:+v.dur||0, views:+v.views||0, pub:v.pub||"" })) };
}
let ttList=[];                 // videos of the source now on screen; the feed pages through this
const PLAY_ICON='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
function ttItem(v,i){
  const b=document.createElement("button"); b.className="ttitem"; b.type="button"; b.dataset.vid=v.id;
  const views=fmtViews(v.views).replace(" views","");
  b.innerHTML=(v.thumb?'<img loading="lazy" decoding="async" src="'+esc(v.thumb)+'" alt="">':'')+
    '<span class="v">'+PLAY_ICON+(views?esc(views):"")+'</span>';
  const open=()=>openFeed(i);
  b.onclick=open;
  b.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } };
  return b;
}
function ttSkeletons(n){ let h=""; for(let i=0;i<n;i++) h+='<div class="ttitem sk"></div>'; return h; }
async function showTikTok(id,seq){
  const src=SOURCES.find(s=>s.id===id&&s.type==="tiktok");
  if(!src){ location.replace("#home"); return; }
  cur={kind:"tiktok",key:id,token:"",done:true,pages:1};
  navEl.hidden=false; navTitle.textContent=(meta[id]&&meta[id].title)||src.handle.replace(/^@/,""); setView("ttgrid");
  let painted=false;
  const paint=data=>{
    if(seq!==navSeq) return;
    if(data.title) navTitle.textContent=data.title;
    ttList=data.videos||[];
    const fi=[...ttgridEl.children].indexOf(document.activeElement);
    ttgridEl.innerHTML="";
    ttList.forEach((v,i)=>ttgridEl.appendChild(ttItem(v,i)));
    refocus(ttgridEl,fi); stateEl.hidden=true;
    if(!ttList.length) showState("Chưa có video.");
    painted=true;
  };
  if(meta[id]&&meta[id].videos&&meta[id].videos.length) paint({videos:meta[id].videos,title:meta[id].title});
  if(!painted && !cacheGet("tt:"+src.file)) ttgridEl.innerHTML=ttSkeletons(12);
  try{ await swr("tt:"+src.file,()=>fetchTikTok(src.file),d=>{ if(meta[id]) meta[id].videos=d.videos; paint(d); }); }
  catch(e){ if(seq!==navSeq||painted) return; ttgridEl.innerHTML=""; showState("Không tải được video.",e,true); }
}

// ---- TikTok feed player (full-screen vertical) ----
let ttFrame=null, ttFeedOpen=false, ttHistPushed=false, ttLastFocused=null;
let ttIndex=0, ttPlaying=false, ttToastTimer=0, ttChannel="";
function ttPost(o){ if(!ttFrame||!ttFrame.contentWindow) return; const w=ttFrame.contentWindow;
  try{ w.postMessage(o,"*"); }catch(_){}            // the embed player's protocol isn't stable across versions,
  try{ w.postMessage(JSON.stringify(o),"*"); }catch(_){} } // so send both object and string forms; one is ignored
function ttToast(m){ const el=$("#tttoast"); el.textContent=m; el.hidden=false; clearTimeout(ttToastTimer); ttToastTimer=setTimeout(()=>{ el.hidden=true; },1200); }
function removeTtFrame(){ if(ttFrame){ try{ ttFrame.remove(); }catch(_){} ttFrame=null; } }
function ttShow(i){
  if(!ttList.length) return;
  ttIndex=Math.max(0,Math.min(i,ttList.length-1));
  const v=ttList[ttIndex];
  ttStage.style.backgroundImage=v.thumb?('url("'+v.thumb.replace(/"/g,"%22")+'")'):"none";
  removeTtFrame();
  ttFrame=document.createElement("iframe");
  ttFrame.setAttribute("allow","autoplay; fullscreen; encrypted-media; picture-in-picture");
  ttFrame.setAttribute("allowfullscreen","");
  ttFrame.src="https://www.tiktok.com/player/v1/"+encodeURIComponent(v.id)+"?autoplay=1&loop=1&controls=1&rel=0&native_context_menu=0&description=0&music_info=0";
  ttStage.insertBefore(ttFrame,ttStage.firstChild);
  ttPlaying=true;
  setTimeout(()=>ttPost({type:"unMute"}),700);
  ttSyncMeta();
}
// TikTok-style date: recent -> "N ngày/giờ/phút trước", this year -> "M-D", older -> "YYYY-M-D"
function ttDate(iso){
  if(!iso) return "";
  const d=new Date(iso); if(isNaN(d)) return "";
  const now=new Date(), sec=(now-d)/1000;
  if(sec<3600) return Math.max(1,Math.floor(sec/60))+" phút trước";
  if(sec<86400) return Math.floor(sec/3600)+" giờ trước";
  if(sec<7*86400) return Math.floor(sec/86400)+" ngày trước";
  const m=d.getMonth()+1, day=d.getDate();
  return (d.getFullYear()===now.getFullYear()?"":d.getFullYear()+"-")+m+"-"+day;
}
function ttSyncMeta(){
  if(!ttFeedOpen) return;
  const v=ttList[ttIndex]||{};
  const date=ttDate(v.pub);
  $("#tttitle").innerHTML='<b>'+esc(ttChannel)+'</b>'+(date?' · <span class="ttdate">'+esc(date)+'</span>':'');
  $("#ttsub").textContent=v.title||""; // full caption, no truncation
}
function ttToggle(){ ttPlaying=!ttPlaying; ttPost({type:ttPlaying?"play":"pause"}); ttToast(ttPlaying?"▶":"❚❚"); }
function openFeed(index){
  if(!ttList.length) return;
  ttChannel=navTitle.textContent||""; // the channel name shown on the grid page
  ttLastFocused=document.activeElement;
  ttFeedOpen=true; ttfeedEl.hidden=false; document.body.style.overflow="hidden";
  ttfeedEl.focus({preventScroll:true});
  ttShow(index);
  // No requestFullscreen: the overlay is already edge-to-edge (position:fixed inset:0), and on desktop
  // fullscreen made Esc need two presses (the first only left fullscreen).
  if(!ttHistPushed){ try{ history.pushState({ttfeed:1},""); ttHistPushed=true; }catch(_){} }
}
function ttCloseFeed(fromHistory){
  if(!ttFeedOpen) return;
  ttFeedOpen=false; removeTtFrame(); ttfeedEl.hidden=true; document.body.style.overflow="";
  ttStage.style.backgroundImage="none";
  if(ttLastFocused && ttLastFocused.isConnected) ttLastFocused.focus({preventScroll:true});
  ttLastFocused=null;
  if(ttHistPushed){ ttHistPushed=false; if(fromHistory!==true) history.back(); }
}
function ttExit(){ if(ttHistPushed) history.back(); else ttCloseFeed(); } // Back pops the pushed state -> popstate closes
function ttKey(k){
  if(!ttFeedOpen) return false;
  switch(k){
    case "ArrowDown": ttShow(ttIndex+1); return true;
    case "ArrowUp": ttShow(ttIndex-1); return true;
    case "ArrowLeft": case "ArrowRight": return true; // no seek (the embed player ignores it); swallow so focus stays put
    case "Enter": case " ": case "MediaPlayPause": case "MediaPlay": case "MediaPause": ttToggle(); return true;
    case "Escape": case "MediaStop": ttExit(); return true;
  }
  return false;
}
// Touch: vertical swipe over the letterbox margins pages the feed (over the video the iframe eats the touch).
let ttTouchY=null;
ttfeedEl.addEventListener("touchstart",e=>{ ttTouchY=e.touches[0].clientY; },{passive:true});
ttfeedEl.addEventListener("touchend",e=>{ if(ttTouchY==null) return; const dy=e.changedTouches[0].clientY-ttTouchY; ttTouchY=null; if(Math.abs(dy)>60) ttShow(ttIndex+(dy<0?1:-1)); },{passive:true});

// ---------------- PLAYER ----------------
// One YT.Player lives for the whole session; opening a video only calls loadVideoById / loadPlaylist.
// It is rebuilt only when the subtitle setting changes between sources (cc_load_policy is fixed at creation).
const modal=$("#modal"), playerEl=$("#player"), toastEl=$("#toast");
const isOpen=()=>modal.classList.contains("open");
let lastFocused=null; // card to return focus to when the player closes (D-pad)
let yt=null, ytReady=false, ytSubs=null, pending=null, histPushed=false;
let prebuf=null;      // {vid,list} loading muted while its card is focused; paused as soon as it plays
let preTimer=0, lastPlayed="";
function createPlayer(subs){
  if(yt){ try{ yt.destroy(); }catch(_){} yt=null; }
  ytReady=false; ytSubs=subs; prebuf=null;
  const host=document.createElement("div"); playerEl.insertBefore(host,toastEl);
  yt=new YT.Player(host,{
    host:"https://www.youtube-nocookie.com", width:"100%", height:"100%",
    playerVars:{ rel:0, modestbranding:1, playsinline:1, fs:1, autoplay:1, cc_load_policy:subs?1:0, cc_lang_pref:"en", hl:"en", origin:location.origin },
    events:{
      onReady:()=>{ ytReady=true; if(pending){ startVideo(pending); pending=null; } },
      onStateChange:e=>{ if(e.data===1 && prebuf) yt.pauseVideo(); }
    }
  });
}
function initPlayer(){
  window.onYouTubeIframeAPIReady=()=>createPlayer(currentSubs);
  const s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s);
}
function ensurePlayer(){ if(yt && ytSubs!==currentSubs) createPlayer(currentSubs); }
function startVideo(r){
  if(r.list && r.index!=null) yt.loadPlaylist({listType:"playlist", list:r.list, index:r.index}); // auto-advances
  else yt.loadVideoById(r.vid);
}
const request=vid=>({ vid, list:currentAutoNextList||"", index:positions[vid] });
// pre-buffer: start loading the focused card's video (muted, hidden) so OK plays it at once
function schedulePrebuffer(vid){
  clearTimeout(preTimer);
  if(!vid || vid===lastPlayed || isOpen()) return;
  preTimer=setTimeout(()=>{
    if(isOpen() || (prebuf && prebuf.vid===vid)) return;
    ensurePlayer(); if(!ytReady) return;
    prebuf=request(vid);
    try{ yt.mute(); startVideo(prebuf); }catch(_){ prebuf=null; }
  },PREBUFFER_MS);
}
function openPlayer(vid){
  clearTimeout(preTimer);
  lastFocused=document.activeElement; lastPlayed=vid;
  modal.classList.add("open"); modal.setAttribute("aria-hidden","false"); document.body.style.overflow="hidden";
  // Focus stays on our own element, not inside the iframe: remote keys then reach the keydown
  // handler below, which drives the player through the IFrame API.
  playerEl.focus({preventScroll:true});
  ensurePlayer();
  const r=request(vid), ready=prebuf && prebuf.vid===vid && prebuf.list===r.list; prebuf=null;
  if(!ytReady){ pending=r; toast("Loading…"); }
  else{ yt.unMute(); if(ready){ yt.seekTo(0,true); yt.playVideo(); } else startVideo(r); }
  // History entry for the open player: Back (phone gesture, or the TV remote via the app) closes the video
  if(!histPushed){ try{ history.pushState({player:1},""); histPushed=true; }catch(_){} }
  // Not inside the app: the player is already edge-to-edge there, and the WebView fullscreen
  // transition costs ~1 s of re-layout and makes the YouTube controls show a second time.
  const req=!IN_APP && (playerEl.requestFullscreen||playerEl.webkitRequestFullscreen);
  if(req) try{ Promise.resolve(req.call(playerEl)).catch(()=>{}); }catch(_){}
}
function closePlayer(fromHistory){
  if(!isOpen()) return;
  const ex=document.fullscreenElement||document.webkitFullscreenElement;
  if(ex){ (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); }
  pending=null; prebuf=null; seekTarget=null; clearTimeout(seekTimer);
  if(ytReady) try{ yt.stopVideo(); }catch(_){}
  toastEl.hidden=true;
  modal.classList.remove("open"); modal.setAttribute("aria-hidden","true"); document.body.style.overflow="";
  if(lastFocused && lastFocused.isConnected) lastFocused.focus({preventScroll:true});
  lastFocused=null;
  if(histPushed){ histPushed=false; if(fromHistory!==true) history.back(); }
}
window.addEventListener("popstate",()=>{ closePlayer(true); ttCloseFeed(true); });

// ---- remote / keyboard control of the player ----
let toastTimer=0;
function toast(msg){ toastEl.textContent=msg; toastEl.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ toastEl.hidden=true; },1200); }
function fmtSec(t){ t=Math.max(0,Math.floor(t)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60, p=n=>String(n).padStart(2,"0"); return h? h+":"+p(m)+":"+p(s) : m+":"+p(s); }
// Repeated presses add up and become ONE seek once they stop: seeking on every press made the player
// re-buffer at each intermediate position, so a 60 s jump took six buffering rounds.
let seekTarget=null, seekTimer=0;
function flushSeek(){ clearTimeout(seekTimer); if(seekTarget==null) return; const t=seekTarget; seekTarget=null; yt.seekTo(t,true); }
function seekBy(sec){
  if(!ytReady){ toast("Loading…"); return; }
  const d=yt.getDuration()||0, now=yt.getCurrentTime();
  let t=(seekTarget!=null?seekTarget:now)+sec; if(t<0) t=0; if(d&&t>d-1) t=d-1;
  seekTarget=t;
  const delta=Math.round(t-now);
  toast((delta>=0?"+":"−")+Math.abs(delta)+"s   "+fmtSec(t)+(d?" / "+fmtSec(d):""));
  clearTimeout(seekTimer); seekTimer=setTimeout(flushSeek,350);
}
function togglePlay(){
  if(!ytReady){ toast("Loading…"); return; }
  flushSeek();
  if(yt.getPlayerState()===1){ yt.pauseVideo(); toast("❚❚"); } else { yt.playVideo(); toast("▶"); }
}
const KEYS={
  ArrowLeft:()=>seekBy(-10), ArrowRight:()=>seekBy(10), ArrowUp:()=>{}, ArrowDown:()=>{}, // up/down: swallowed so focus never leaves the player
  Enter:togglePlay, " ":togglePlay, MediaPlayPause:togglePlay, MediaPlay:togglePlay, MediaPause:togglePlay,
  MediaRewind:()=>seekBy(-10), MediaFastForward:()=>seekBy(10), MediaStop:()=>closePlayer(), Escape:()=>closePlayer(),
};
function handleKey(k){ const f=KEYS[k]; if(!f||!isOpen()) return false; f(); return true; }
// called from the Android app for media buttons the WebView doesn't forward
window.tvKey=k=>{ if(isOpen()) return handleKey(k); if(ttFeedOpen) return ttKey(k); return false; };
document.addEventListener("keydown",e=>{
  if(isOpen()){ if(handleKey(e.key)){ e.preventDefault(); e.stopPropagation(); } return; } // block spatial nav into the iframe
  if(ttFeedOpen){ if(ttKey(e.key)){ e.preventDefault(); e.stopPropagation(); } }
},true);
function onFsChange(){ if(!(document.fullscreenElement||document.webkitFullscreenElement)) closePlayer(); }
document.addEventListener("fullscreenchange",onFsChange);
document.addEventListener("webkitfullscreenchange",onFsChange);

moreBtn.onclick=()=>{ const seq=navSeq; if(cur.kind==="videos"&&!cur.done) loadVideos(false,seq); };

render();     // initial route first so its API requests go out before the player script
initPlayer(); // load the YouTube player once, up front
</script>
</body>
</html>
