<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fff; --ink:#0f0f0f; --muted:#606060; --line:#e5e5e5; --hover:#f2f2f2; --chip:#f2f2f2; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{ font:14px/1.4 Roboto,system-ui,Arial,sans-serif; background:var(--bg); color:var(--ink); -webkit-tap-highlight-color:transparent; }
  button{font-family:inherit}
  img{display:block}

  main{max-width:1280px; margin:0 auto; padding:20px 24px 80px}
  .page{animation:fade .18s ease}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

  .nav{display:flex; align-items:center; gap:14px; margin:0 0 20px}
  .nav[hidden]{display:none}
  .back{ border:none; cursor:pointer; width:40px; height:40px; border-radius:50%; background:transparent; color:var(--ink); font-size:22px; display:grid; place-items:center; }
  .back:hover{background:var(--hover)}
  .navtitle{font-size:20px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  .home{display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .src{ background:none; border:none; text-align:left; cursor:pointer; padding:0; display:flex; flex-direction:column; gap:10px; }
  .src .banner{position:relative; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:#e9e9e9}
  .src .banner img{width:100%; height:100%; object-fit:cover}
  .src:hover .banner{filter:brightness(.94)}
  .src .badge{ position:absolute; top:8px; left:8px; background:rgba(0,0,0,.75); color:#fff; font-weight:500; font-size:12px; padding:3px 8px; border-radius:6px; }
  .src .nm{font-size:16px; font-weight:700; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .src .sub{color:var(--muted); font-size:13px; margin-top:2px}

  .grid{display:grid; gap:36px 16px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{cursor:pointer; display:flex; flex-direction:column}
  .thumb{position:relative; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:#e9e9e9; transition:border-radius .15s}
  .thumb img{width:100%; height:100%; object-fit:cover}
  .card:hover .thumb{border-radius:0}
  .dur{ position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.8); color:#fff; font-size:12px; font-weight:500; padding:2px 5px; border-radius:5px; line-height:1.2; }
  .row{display:flex; gap:12px; margin-top:12px}
  .av{width:36px; height:36px; border-radius:50%; flex:0 0 36px; object-fit:cover; background:#ddd}
  .txt{min-width:0}
  .title{font-size:15px; font-weight:500; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .byline{color:var(--muted); font-size:13px; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .byline .ch{display:block}

  .more{display:flex; justify-content:center; margin:40px 0 0}
  .more button{ cursor:pointer; font-size:14px; font-weight:500; border:1px solid var(--line); padding:9px 16px; border-radius:999px; background:var(--chip); color:var(--ink); }
  .more button:hover{background:#e5e5e5}
  .more button:disabled{opacity:.5; cursor:default}

  .state{text-align:center; color:var(--muted); padding:70px 20px; font-size:15px}
  .spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:#909090;animation:sp 1s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}

  .sk .thumb,.sk .banner{background:linear-gradient(90deg,#eee,#f6f6f6,#eee); background-size:200% 100%; animation:sh 1.2s infinite}
  .sk .l{height:14px; border-radius:6px; background:#eee; margin-top:10px}
  .sk .l.s{width:55%}
  @keyframes sh{to{background-position:-200% 0}}

  .modal{position:fixed; inset:0; z-index:50; background:rgba(15,15,15,.95); display:none; align-items:center; justify-content:center; padding:16px}
  .modal.open{display:flex}
  .player{width:min(1100px,100%)}
  .frameWrap{position:relative; aspect-ratio:16/9; width:100%; background:#000; border-radius:12px; overflow:hidden}
  .frameWrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
  .close{position:absolute; top:-52px; right:0; width:40px; height:40px; border-radius:50%; border:none; cursor:pointer; background:#fff; color:#0f0f0f; font-size:22px; line-height:1}
  .ptitle{color:#fff; font-weight:500; margin:14px 2px 0; font-size:16px}
  @media (max-width:520px){ main{padding:16px 14px 60px} .close{top:auto; bottom:-52px; right:50%; transform:translateX(50%)} }
</style>
</head>
<body>
<main>
  <div class="nav" id="nav" hidden>
    <button class="back" id="backBtn" aria-label="Back">←</button>
    <div class="navtitle" id="navtitle"></div>
  </div>
  <div class="home" id="home" hidden></div>
  <div class="grid" id="grid" hidden></div>
  <div class="state" id="state" hidden></div>
  <div class="more" id="moreWrap" hidden><button id="moreBtn">Load more</button></div>
</main>

<div class="modal" id="modal" aria-hidden="true">
  <div class="player">
    <div class="frameWrap">
      <button class="close" id="closeBtn" aria-label="Close">✕</button>
      <div id="frameHost"></div>
    </div>
    <div class="ptitle" id="ptitle"></div>
  </div>
</div>

<script>
// ====== CONFIG — only the sources listed here can be watched ======
const API_KEY = "AIzaSyDGWoJDMbutkYWJZZzullATm1cnttCAQUE"; // restricted: github.io referrer + YouTube Data API only
const SOURCES = [
  { id:"paw",     type:"handle",          handle:"@PAWPatrolOfficial" },
  { id:"cloud",   type:"playlist",        playlistId:"PLfYEB5yLOF-CA0qZ4j3N19waHIDQFalqE" },
  { id:"pnf",     type:"playlist",        playlistId:"PLiv1IUQDVSNKB3oq2gblc2dYkjhn_iIFi" }, // Phineas and Ferb S1
  { id:"pokemon", type:"channelPlaylists", handle:"@PokémonAsiaENG" },                  // click -> its playlists
  { id:"maruko",  type:"playlist",        playlistId:"PLQGFvBFre_B3zygU6fi8irYZAZw6Pz7TP" }, // Chibi Maruko Chan English
];
const PAGE_SIZE = 24;
const REGION = "VN"; // hide videos that can't play in this region (region-blocked / not embeddable)
// ==================================================================

const API = "https://www.googleapis.com/youtube/v3/";
const $ = s => document.querySelector(s);
const homeEl=$("#home"), gridEl=$("#grid"), stateEl=$("#state"), moreWrap=$("#moreWrap"), moreBtn=$("#moreBtn");
const navEl=$("#nav"), navTitle=$("#navtitle");

const meta={};          // source id -> resolved meta
let navSeq=0;           // bumps on every route change; async guards compare against it
let cur={kind:null,key:null,token:"",done:false}; // current list view paging state
let currentAvatar="";

const decoder=document.createElement("textarea");
const decode=t=>{ decoder.innerHTML=t||""; return decoder.value; };
const esc=t=>(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick=th=>(th&&(th.maxres||th.standard||th.high||th.medium||th.default||{}).url)||"";
const avpick=th=>(th&&(th.default||th.medium||th.high||{}).url)||"";

function fmtDur(iso){ const m=(iso||"").match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); if(!m) return ""; const h=+m[1]||0,mi=+m[2]||0,s=+m[3]||0,p=n=>String(n).padStart(2,"0"); return h? h+":"+p(mi)+":"+p(s):mi+":"+p(s); }
function fmtViews(n){ n=+n; if(!isFinite(n)||n<=0) return ""; if(n>=1e6) return +(n/1e6).toFixed(n>=1e7?0:1)+"M views"; if(n>=1e3) return +(n/1e3).toFixed(n>=1e4?0:1)+"K views"; return n+" views"; }
function ago(iso){ const d=(Date.now()-new Date(iso))/1000; for(const [nm,sec] of [["year",31536000],["month",2592000],["week",604800],["day",86400],["hour",3600],["minute",60]]){ const v=Math.floor(d/sec); if(v>=1) return v+" "+nm+(v>1?"s":"")+" ago"; } return "just now"; }
function watchable(v){
  if(v.status && v.status.embeddable===false) return false;
  const rr=v.contentDetails&&v.contentDetails.regionRestriction;
  if(rr){ if(rr.blocked&&rr.blocked.includes(REGION)) return false; if(rr.allowed&&!rr.allowed.includes(REGION)) return false; }
  return true;
}

async function api(path,params){
  const u=new URL(API+path);
  Object.entries(params).forEach(([k,v])=>v!=null&&u.searchParams.set(k,v));
  u.searchParams.set("key",API_KEY);
  const r=await fetch(u); const j=await r.json();
  if(!r.ok) throw new Error(j.error?.message||("HTTP "+r.status));
  return j;
}

async function fetchMeta(src){
  if(meta[src.id]) return meta[src.id];
  let m;
  if(src.type==="playlist"){
    const j=await api("playlists",{ part:"snippet,contentDetails", id:src.playlistId });
    const it=j.items?.[0]; if(!it) throw new Error("Playlist not found");
    m={ title:decode(it.snippet.title), thumb:pick(it.snippet.thumbnails), avatar:pick(it.snippet.thumbnails),
        playlistId:src.playlistId, type:"Playlist", count:it.contentDetails?.itemCount??null };
  }else{ // handle or channelPlaylists
    const j=await api("channels",{ part:"snippet,contentDetails,statistics", forHandle:src.handle });
    const it=j.items?.[0]; if(!it) throw new Error("Channel not found: "+src.handle);
    m={ title:decode(it.snippet.title), thumb:pick(it.snippet.thumbnails), avatar:avpick(it.snippet.thumbnails),
        channelId:it.id, playlistId:it.contentDetails.relatedPlaylists.uploads, type:"Channel",
        count:Number(it.statistics?.videoCount)||null };
  }
  meta[src.id]=m; return m;
}

// ---------------- ROUTER (hash = page) ----------------
function route(){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  if(!h||h==="home") return {v:"home"};
  if(h.startsWith("ch/")) return {v:"channel",id:h.slice(3)};
  if(h.startsWith("pl/")) return {v:"playlist",pid:h.slice(3)};
  return {v:"home"};
}
function render(){
  const seq=++navSeq;
  if(modal.classList.contains("open")) closePlayer();
  const r=route();
  if(r.v==="home") renderHome(seq);
  else if(r.v==="channel") showChannel(r.id,seq);
  else showVideos(r.pid,seq);
}
window.addEventListener("hashchange",render);

function setView(which){ // "home" grid of source/playlist cards, or "grid" video cards
  homeEl.hidden = which!=="home";
  gridEl.hidden = which!=="grid";
  stateEl.hidden=true; moreWrap.hidden=true;
  window.scrollTo(0,0);
}
function bump(el){ el.classList.remove("page"); void el.offsetWidth; el.classList.add("page"); }
function showState(msg){ stateEl.hidden=false; stateEl.innerHTML=msg; }
function skeletonsSrc(n){ let h=""; for(let i=0;i<n;i++) h+='<div class="src sk"><div class="banner"></div><div class="l"></div><div class="l s"></div></div>'; return h; }
function skeletons(n){ let h=""; for(let i=0;i<n;i++) h+='<div class="card sk"><div class="thumb"></div><div class="row"><div class="txt" style="flex:1"><div class="l"></div><div class="l s"></div></div></div></div>'; return h; }

// ---------------- HOME: list of sources ----------------
async function renderHome(seq){
  navEl.hidden=true; setView("home"); bump(homeEl);
  homeEl.innerHTML=skeletonsSrc(SOURCES.length);
  try{
    const metas=await Promise.all(SOURCES.map(fetchMeta));
    if(seq!==navSeq) return;
    homeEl.innerHTML="";
    SOURCES.forEach((s,i)=>{
      const m=metas[i]; const cnt=m.count!=null?(m.count+" videos"):"";
      const b=document.createElement("button"); b.className="src"; b.type="button";
      b.innerHTML='<div class="banner"><img loading="lazy" src="'+esc(m.thumb)+'" alt=""><span class="badge">'+esc(m.type)+'</span></div>'+
        '<div><div class="nm">'+esc(m.title)+'</div>'+(cnt?'<div class="sub">'+esc(cnt)+'</div>':'')+'</div>';
      b.onclick=()=>{ location.hash = (s.type==="channelPlaylists") ? ("ch/"+s.id) : ("pl/"+m.playlistId); };
      homeEl.appendChild(b);
    });
  }catch(e){ if(seq!==navSeq) return; homeEl.innerHTML=""; showState("Couldn't load the list.<br><small>"+esc(e.message)+"</small>"); }
}

// ---------------- CHANNEL: its playlists ----------------
async function showChannel(id,seq){
  const src=SOURCES.find(s=>s.id===id);
  if(!src){ location.replace("#home"); return; }
  cur={kind:"channel",key:null,token:"",done:false};
  navEl.hidden=false; navTitle.textContent="…";
  setView("home"); bump(homeEl); homeEl.innerHTML=skeletonsSrc(6);
  try{
    const m=await fetchMeta(src);
    if(seq!==navSeq) return;
    navTitle.textContent=m.title; cur.key=m.channelId;
    homeEl.innerHTML="";
    await loadPlaylists(true,seq);
  }catch(e){ if(seq!==navSeq) return; homeEl.innerHTML=""; showState("Couldn't load playlists.<br><small>"+esc(e.message)+"</small>"); }
}
async function loadPlaylists(first,seq){
  const cid=cur.key; moreBtn.disabled=true;
  if(!first) homeEl.insertAdjacentHTML("beforeend",""); // no-op keeps existing
  try{
    const j=await api("playlists",{ part:"snippet,contentDetails", channelId:cid, maxResults:PAGE_SIZE, pageToken:cur.token||undefined });
    if(seq!==navSeq||cur.kind!=="channel"||cur.key!==cid) return;
    (j.items||[]).forEach(pl=>{
      const pid=pl.id, title=decode(pl.snippet.title), thumb=pick(pl.snippet.thumbnails), cnt=pl.contentDetails?.itemCount;
      const b=document.createElement("button"); b.className="src"; b.type="button";
      b.innerHTML='<div class="banner"><img loading="lazy" src="'+esc(thumb)+'" alt=""><span class="badge">Playlist</span></div>'+
        '<div><div class="nm">'+esc(title)+'</div>'+(cnt!=null?'<div class="sub">'+cnt+' videos</div>':'')+'</div>';
      b.onclick=()=>{ location.hash="pl/"+pid; };
      homeEl.appendChild(b);
    });
    cur.token=j.nextPageToken||""; cur.done=!j.nextPageToken;
    moreWrap.hidden=cur.done;
    if(homeEl.children.length===0) showState("No playlists here.");
  }catch(e){ if(seq!==navSeq) return; showState("Couldn't load playlists.<br><small>"+esc(e.message)+"</small>"); }
  finally{ moreBtn.disabled=false; }
}

// ---------------- PLAYLIST: its videos ----------------
async function getPlaylistHeader(pid){
  for(const id in meta){ if(meta[id].playlistId===pid) return {title:meta[id].title, avatar:meta[id].avatar}; }
  const j=await api("playlists",{ part:"snippet", id:pid });
  const it=j.items?.[0];
  return it ? {title:decode(it.snippet.title), avatar:pick(it.snippet.thumbnails)} : {title:"",avatar:""};
}
async function showVideos(pid,seq){
  cur={kind:"videos",key:pid,token:"",done:false}; currentAvatar="";
  navEl.hidden=false; navTitle.textContent="…";
  setView("grid"); bump(gridEl); gridEl.innerHTML=skeletons(8);
  try{
    const h=await getPlaylistHeader(pid);
    if(seq!==navSeq) return;
    navTitle.textContent=h.title; currentAvatar=h.avatar||"";
    await loadVideos(true,seq);
  }catch(e){ if(seq!==navSeq) return; gridEl.innerHTML=""; showState("Couldn't load videos.<br><small>"+esc(e.message)+"</small>"); }
}
async function loadVideos(first,seq){
  const pid=cur.key; moreBtn.disabled=true;
  if(first) gridEl.innerHTML=skeletons(8);
  try{
    const jp=await api("playlistItems",{ part:"contentDetails", maxResults:PAGE_SIZE, playlistId:pid, pageToken:cur.token||undefined });
    if(seq!==navSeq||cur.kind!=="videos"||cur.key!==pid) return;
    const ids=(jp.items||[]).map(it=>it.contentDetails?.videoId).filter(Boolean);
    let vids=[];
    if(ids.length){
      const jv=await api("videos",{ part:"snippet,contentDetails,statistics,status", id:ids.join(",") });
      if(seq!==navSeq||cur.key!==pid) return;
      vids=(jv.items||[]).filter(watchable);
    }
    if(first) gridEl.innerHTML="";
    vids.forEach(addCard);
    cur.token=jp.nextPageToken||""; cur.done=!jp.nextPageToken;
    moreWrap.hidden=cur.done;
    if(gridEl.children.length===0) showState("No videos here yet.");
  }catch(e){ if(seq!==navSeq) return; if(first) gridEl.innerHTML=""; showState("Couldn't load videos.<br><small>"+esc(e.message)+"</small>"); }
  finally{ moreBtn.disabled=false; }
}

function addCard(v){
  const vid=v.id, sn=v.snippet;
  const img=pick(sn.thumbnails), title=decode(sn.title), ch=decode(sn.channelTitle||"");
  const dur=fmtDur(v.contentDetails?.duration), vw=fmtViews(v.statistics?.viewCount);
  const line2=[vw, sn.publishedAt?ago(sn.publishedAt):""].filter(Boolean).join(" · ");
  const card=document.createElement("div"); card.className="card"; card.tabIndex=0; card.setAttribute("role","button");
  card.innerHTML=
    '<div class="thumb"><img loading="lazy" src="'+esc(img)+'" alt="">'+(dur?'<span class="dur">'+esc(dur)+'</span>':'')+'</div>'+
    '<div class="row">'+(currentAvatar?'<img class="av" loading="lazy" src="'+esc(currentAvatar)+'" alt="">':'')+
      '<div class="txt"><div class="title">'+esc(title)+'</div>'+
      '<div class="byline">'+(ch?'<span class="ch">'+esc(ch)+'</span>':'')+(line2?'<span>'+esc(line2)+'</span>':'')+'</div></div></div>';
  const open=()=>openPlayer(vid,title);
  card.onclick=open;
  card.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } };
  gridEl.appendChild(card);
}

// ---------------- PLAYER (English subtitles forced on) ----------------
const modal=$("#modal"), frameHost=$("#frameHost"), ptitle=$("#ptitle");
const frameWrap=document.querySelector(".frameWrap");
function openPlayer(vid,title){
  frameHost.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(vid)+
    '?rel=0&modestbranding=1&playsinline=1&autoplay=1&fs=1&cc_load_policy=1&cc_lang_pref=en&hl=en"'+
    ' allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
  ptitle.textContent=title;
  modal.classList.add("open"); modal.setAttribute("aria-hidden","false"); document.body.style.overflow="hidden";
  const req=frameWrap.requestFullscreen||frameWrap.webkitRequestFullscreen;
  if(req) try{ Promise.resolve(req.call(frameWrap)).catch(()=>{}); }catch(_){}
}
function closePlayer(){
  const ex=document.fullscreenElement||document.webkitFullscreenElement;
  if(ex){ (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); }
  modal.classList.remove("open"); modal.setAttribute("aria-hidden","true"); frameHost.innerHTML=""; document.body.style.overflow="";
}
function onFsChange(){ if(!(document.fullscreenElement||document.webkitFullscreenElement) && modal.classList.contains("open")) closePlayer(); }
document.addEventListener("fullscreenchange",onFsChange);
document.addEventListener("webkitfullscreenchange",onFsChange);
$("#closeBtn").onclick=closePlayer;
modal.onclick=e=>{ if(e.target===modal) closePlayer(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&modal.classList.contains("open")) closePlayer(); });

$("#backBtn").onclick=()=>{ if(history.length>1) history.back(); else location.hash="home"; };
moreBtn.onclick=()=>{ const seq=navSeq; if(cur.kind==="videos") loadVideos(false,seq); else if(cur.kind==="channel") loadPlaylists(false,seq); };

render(); // initial route
</script>
</body>
</html>
